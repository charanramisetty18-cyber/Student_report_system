<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Student Report System</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            🎓 Student Report System
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

            <a href="signup.html">Sign Up</a>

        </nav>

    </header>


    <!-- Signup Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Create Account</h1>

            <p>
                Register to use the Student Report System.
            </p>


            <form id="signupForm">

                <!-- Name -->
                <div style="margin-bottom: 15px;">

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                </div>


                <!-- Email -->
                <div style="margin-bottom: 15px;">

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                </div>


                <!-- Password -->
                <div style="margin-bottom: 15px;">

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                </div>


                <!-- Role -->
                <div style="margin-bottom: 20px;">

                    <select
                        id="signupRole"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                        <option value="student">
                            Student
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn secondary"
                    style="border: none; cursor: pointer;"
                >
                    Create Account
                </button>

            </form>


            <p style="margin-top: 25px;">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p>

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Student Report System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>

</html>
