<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Report System</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            🎓 Student Report System
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

            <a href="signup.html">Sign Up</a>

        </nav>

    </header>


    <!-- Login Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Login</h1>

            <p>
                Login to access your Student Report System account.
            </p>


            <form id="loginForm">

                <div style="margin-bottom: 15px;">

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                </div>


                <div style="margin-bottom: 20px;">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                        style="width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    style="border: none; cursor: pointer;"
                >
                    Login
                </button>

            </form>


            <p style="margin-top: 25px;">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>


            <p>

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Student Report System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>

</html>
